# DDPO fine-tuning of dm_goal against a frozen PufferDrive planner.
# Data-space policy: nn_modules.dm_goal.DMGoal.

model_type: dm_goal
device: cuda
seed: 0

# --- training mode (WHICH dims are free) ----------------------------------
# goal_only  : fixed map + fixed agent init states, only goal points trained
# agent_only : fixed map, agent init states AND goal points trained
# full       : map (lane chain) + agent init states + goal points trained
mode: agent_only
inpaint_noised: true        # inpaint fixed entries with q_sample(x0,t); false -> clean x0
# --- node control (WHICH agents are free; ego is local index 0) ------------
control_ego: false           # false -> fix ego to GT, generate only other agents
control_agent_num: 1       # number of non-ego agents to generate; -1 = all

# --- ego goal override (rule-based, applied at conditioning load) -----------
# Real SDC trajectories often barely move (goal ~= spawn), so the ego is never
# controlled and the criticality reward gets no signal. Replace the ego goal
# with a far, forward, on-road lane endpoint so the ego actually drives; the
# (fixed) ego node then conditions the generated adversaries. Falls back to the
# original goal when no lane endpoint qualifies.
ego_goal_override:
  enabled: true
  min_distance: 15.0          # m; drop lane endpoints closer than this to the ego
  top_k: 8                    # sample the goal among the top_k farthest endpoints
  noise: 1.0                  # m; uniform +/- jitter (< goal_offlane_threshold, stays on-lane)
  seed: 0                     # combined with the scene index -> deterministic per scene

# --- artifacts --------------------------------------------------------------
model_ckpt: ${scratch_root}/checkpoints/scenario_dreamer_dm_goal_train/last.ckpt
use_ema_weights: true

# --- conditioning pools (native dm_goal dataset; no dump step) ---------------
train_split: train
eval_split: val
pool_size: 2048

# --- rollout / reward ---------------------------------------------------------
reward_backend: numpy      # "numpy" | "puffer"
pufferdrive_root: ${project_root}/PufferDrive
sim_steps: 91
planner_deterministic: true
ttc_tau: 3.0
init_overlap_margin: 0.0
goal_offlane_threshold: 1.0     # m from nearest lane centerline; goal beyond -> off-lane
goal_onroad_threshold: 1.0      # m from nearest lane centerline; spawn beyond -> off-lane
goal_offlane_penalty: 1.0       # reward -= penalty * frac of moving cars off-lane at
                                # spawn OR goal. lowered from 5 so on-lane close-approach
                                # reward can win over a boring on-lane scene
parking_mismatch_penalty: 0.5
# Dense shaping toward criticality (numpy backend): bonus =
# min_dist_coef * clip(1 - ego_adv_min_dist / min_dist_dmax, 0, 1), the closest
# same-step ego<->controlled-adversary centre distance over the rollout.
min_dist_coef: 0.5
min_dist_dmax: 10.0             # metres; beyond this the bonus saturates at 0 (fov=64)
# Penalise a controlled adversary generated parked (goal within 2 m of spawn)
# to force it to actually drive: reward -= penalty * frac of parked adversaries.
controlled_parking_penalty: 0.5

# --- DDPO ---------------------------------------------------------------------
sampler: ddpm                 # "ddpm" keeps the original 100-step policy; "ddim" uses stochastic DDIM
ddim_steps: 25                # only used when sampler=ddim
ddim_eta: 1.0                 # eta>0 keeps reverse transitions stochastic for DDPO logprob
batch_size: 32
num_iterations: 20000
inner_epochs: 1
k_steps: 8
min_diffusion_t: 20
bf16: false
logprob_bf16: false           # keep DDPO logprob/ratio in fp32; bf16 can inflate IS ratios
lr: 3e-6
weight_decay: 1e-4
grad_clip: 1.0
save_every: 100
# Derived from the entrypoint's experiment.* block (single source of truth).
output_dir: ${experiment.output_dir}

ddpo:
  estimator: is
  clip_range: 1.0e-4
  kl_coef: 0.01  # analytic KL(policy||ref) trust region over free dims of controlled nodes; 0 disables
  adv_clip: 5.0
  adv_eps: 1.0e-6
  logratio_clip: 20.0

# --- logging / eval -----------------------------------------------------------
wandb:
  enabled: true
  project: ${experiment.project}
  entity: null
  run_name: ${experiment.run_name}
eval_every: 50
eval_num_scenes: 4
eval_visualize_reference: true
eval_visualize_conditioning: true
save_gif: true
gif_fps: 10
gif_max_frames: 90
