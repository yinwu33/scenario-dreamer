# DDPO fine-tuning of ldm_goal against a frozen PufferDrive planner.
# Latent-space policy: nn_modules.ldm.LDM + frozen goal AutoEncoder decoder.

model_type: ldm_goal
device: cuda
seed: 0

# --- artifacts --------------------------------------------------------------
ldm_ckpt: ${scratch_root}/checkpoints/scenario_dreamer_ldm_goal_waymo/last.ckpt
ae_ckpt: ${scratch_root}/checkpoints/scenario_dreamer_ae_goal_waymo/last.ckpt
use_ema_weights: true

# --- conditioning pools (native ldm_goal latent cache; no dump step) ----------
train_split: train
eval_split: val
pool_size: 2048

# --- rollout / reward ---------------------------------------------------------
reward_backend: numpy      # "numpy" | "puffer"
pufferdrive_root: ${project_root}/PufferDrive
sim_steps: 91
planner_deterministic: true
ttc_tau: 3.0
init_overlap_margin: 0.0
goal_offlane_threshold: 1.5
goal_onroad_threshold: 2.0
goal_offlane_penalty: 5
parking_mismatch_penalty: 0.0

# --- DDPO ---------------------------------------------------------------------
batch_size: 16
num_iterations: 2000
inner_epochs: 1
k_steps: 4
min_diffusion_t: 5
bf16: true
lr: 1e-5
weight_decay: 1e-4
grad_clip: 1.0
save_every: 100
# Derived from the entrypoint's experiment.* block (single source of truth).
output_dir: ${experiment.output_dir}

ddpo:
  estimator: is
  clip_range: 1.0e-4
  kl_coef: 0.0  # analytic KL(policy||ref) trust region; 0 disables. Retune: magnitude differs from the old (broken) sampled estimator.
  adv_clip: 5.0
  adv_eps: 1.0e-6
  logratio_clip: 20.0

# --- logging / eval -----------------------------------------------------------
wandb:
  enabled: true
  project: ${experiment.project}
  entity: null
  run_name: ${experiment.run_name}
eval_every: 50
eval_num_scenes: 4
eval_visualize_before_rl: true
eval_visualize_no_adv: true
eval_static_baselines_once: true
save_gif: true
gif_fps: 10
gif_max_frames: 90
