# Legacy DDPO group for dm_goal. Prefer cfgs/ddpo/dm_goal.yaml or
# cfgs/ddpo/ldm_goal.yaml through the explicit top-level configs.
# DDPO fine-tuning of dm_goal against a frozen PufferDrive planner.
# The planner is trained in PufferDrive and its .pt copied to data/planner/.

model_type: dm_goal
device: cuda
seed: 0

# --- training mode (WHICH dims are free) ----------------------------------
# goal_only  : fixed map + fixed agent init states, only goal points trained
# agent_only : fixed map, agent init states AND goal points trained
# full       : map (lane chain) + agent init states + goal points trained
mode: goal_only
inpaint_noised: true        # inpaint fixed entries with q_sample(x0,t); false -> clean x0
# --- node control (WHICH agents are free; ego is local index 0) ------------
control_ego: true           # false -> fix ego to GT, generate only other agents
control_agent_num: -1       # number of non-ego agents to generate; -1 = all

# --- artifacts --------------------------------------------------------------
model_ckpt: ${scratch_root}/checkpoints/scenario_dreamer_dm_goal_train/last.ckpt
use_ema_weights: true

# --- conditioning pools (native dm_goal dataset; no dump step) ---------------
train_split: train
eval_split: val
pool_size: 2048             # graphs drawn from the train split (lazy-loaded)

# --- rollout / reward ---------------------------------------------------------
sim_steps: 91
planner_deterministic: true
ttc_tau: 3.0                    # dense reward = clip(1 - ego_min_TTC/ttc_tau, 0, 1);
                                # collision caps at 1, ttc>=ttc_tau gives 0
init_overlap_margin: 0.0        # metres of box inflation for the t=0 vehicle-overlap
                                # (init_invalid) check; 0 allows bumper-to-bumper jams
goal_offlane_threshold: 1.5     # metres from nearest lane centerline; goal beyond -> off-lane
goal_onroad_threshold: 2.0      # metres from nearest lane centerline; spawn beyond -> off-lane
goal_offlane_penalty: 5       # reward -= penalty * frac of moving cars off-lane at spawn
                                # OR goal (parked agents and non-cars exempt)
parking_mismatch_penalty: 0.5   # goal mode: reward -= penalty * frac of agents whose
                                # parking state (goal<2m of spawn) differs from GT

# --- DDPO ---------------------------------------------------------------------
batch_size: 32              # scenes generated + rolled out per iteration
num_iterations: 2000
inner_epochs: 1             # >1 requires estimator=is (PPO importance sampling)
k_steps: 4                  # random denoising steps differentiated per update
min_diffusion_t: 5          # skip very low-noise steps (brittle log-prob ratios)
bf16: true                  # use CUDA bfloat16 autocast for differentiated logprob updates
lr: 1e-5
weight_decay: 1e-4
grad_clip: 1.0
save_every: 100
output_dir: ${scratch_root}/checkpoints/ddpo_dm_goal_${ddpo.mode}

ddpo:
  estimator: is             # "sf" (REINFORCE) | "is" (PPO clip)
  clip_range: 1.0e-4
  kl_coef: 0.01             # KL-to-base: keeps scenes on-manifold (anti reward-hacking)
  adv_clip: 5.0
  adv_eps: 1.0e-6
  logratio_clip: 20.0

# --- logging / eval -----------------------------------------------------------
wandb:
  enabled: true
  project: scenario_dreamer_ddpo
  entity: null
  run_name: null            # null -> ddpo_dm_goal_${mode}
eval_every: 50              # val viz pass every N iterations (0 disables)
eval_num_scenes: 4
eval_visualize_reference: true      # frozen pretrained policy, same val conditioning/noise
eval_visualize_conditioning: true   # unmodified validation init/goals/map, no diffusion sample
save_gif: true
gif_fps: 10
gif_max_frames: 90
