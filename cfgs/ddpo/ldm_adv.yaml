# DDPO fine-tuning of ldm_adv against a frozen PufferDrive planner.
#
# Latent-space single-adversary policy: nn_modules.ldm_adv.LDMAdv runs init_adv
# (the real ego + lane latents are held fixed; only the one adversary latent is
# denoised and trained), and a frozen goal AutoEncoder decodes the ego+adv scene.
#
# Mirrors the map-conditioned dm flow (config_critical_scene_map_conditioned_dm_goal):
#   * the conditioning pool can keep the full real scene and insert one generated
#     adversary as an extra agent (LDMAdvConditioningPool);
#   * the SAME Phase-2 reward + GRPO settings are used verbatim (see below);
#   * instead of the dm flow's ego-goal override we filter out near-stationary egos
#     (min_ego_drive), keeping each ego's real on-road goal.

model_type: ldm_adv
device: cuda
seed: 0

# --- conditioning / pruning ------------------------------------------------
# Drop scenes whose real ego barely drives (GT goal within this many metres of
# spawn): a near-stationary ego gives the criticality reward no signal.
min_ego_drive: 10.0          # metres (map is 64x64 / fov=64)
# Keep the full real normal scene (ldm_adv's intended setting): the adversary is
# generated in the context of all real neighbours and decoded alongside them.
# Set true to instead prune the base to ego+adv (cleanest criticality credit, but
# loses the full scene). GRPO per-context whitening baselines out the constant
# normal-scene contribution, so the default keeps credit attributable to the adv.
prune_base_to_ego: false
# DDPO insertion mode: keep the selected real adversary in the normal-agent
# context and append the generated adversary as an extra agent during decode.
# Base ldm_adv training still uses the replacement/missing-agent dataset path.
insert_adv_as_extra: true

# Adversary conditioning target (requires a base ldm_adv ckpt trained with
# model.use_adv_conditioning=true). The adversary is generated from noise, so the
# real adv's labels are overridden with this target: the conditioned base model
# then samples the requested adversary category.
#
# Each field can be:
#   * a single value  -> fixed for every scene            (e.g. motion: moving)
#   * a list          -> sampled uniformly per scene      (e.g. goal_dist: [middle, far])
#   * null / omitted  -> the model's NULL TOKEN: generated unconditionally and
#                        skipped by the invalid-check below (e.g. ego_dist: null).
#                        (Requires a base ckpt fine-tuned with independent per-field
#                        adv dropout so partial-null is in-distribution; the older
#                        all-or-nothing base only saw all-4-null together.)
# Values accept int bucket ids OR names:
#   type:      vehicle(0) / pedestrian(1) / cyclist(2)
#   motion:    parked(0)  / moving(1)
#   goal_dist: near(0)    / middle(1) / far(2)   (goal-spawn travel distance)
#   ego_dist:  near(0)    / middle(1) / far(2)   (adversary distance to ego)
# The per-scene draw is DETERMINISTIC in (seed, scene_idx): an adv target is fixed
# per scene, so it is constant within a GRPO group (per-context whitening stays
# valid) and stable across epochs, while varying across the pool. Keeping the set
# aligned with the reward (vehicle, moving, near/middle ego) biases generation
# toward the region the reward already wants. enabled=false keeps each scene's
# real adv labels instead. NOTE: combos that are rare in the real-data label
# distribution are out-of-distribution for the frozen conditional prior.
adv_cond_target:
  enabled: true
  type: vehicle            # fixed  [vehicle, pedestrian, cyclist]
  motion: moving           # fixed (a parked adversary violates the condition), [moving, parked]
  goal_dist: [middle, far] # sample per scene from {middle, far}, [near, middle, far]
  ego_dist: null           # null token: unconditional + not checked (use [near, middle, far] to randomize instead)

# Condition-violation gate (sim.hooks.GenAgentInvalidHook): reject a conditionally-
# generated adversary if its realized labels fall in a different bucket than the
# requested adv_cond_target on ANY enabled field (penalty graded by the metric
# distance past the bucket boundary -- see reward.invalid_grade_scale). This
# generalises the parked-adv penalty: with check_motion + motion=moving, a parked
# adversary is one such violation. Bucket thresholds are taken from the ldm_adv
# dataset config (cfgs/ldm_adv/dataset.yaml) so they match training's discretization.
# Disable a field the model cannot reliably control or that the target leaves
# unconstrained. enabled=false falls back to the plain parked-adv gate.
#   check_type      -> realized agent type == target type (veh/ped/cyc)
#   check_motion    -> parked vs moving (||goal - spawn|| vs MIN_DISTANCE_TO_GOAL)
#   check_goal_dist -> near/middle/far bucket of ||goal - spawn||
#   check_ego_dist  -> near/middle/far bucket of ||adv spawn - ego spawn||
# NOTE: keep adv_cond_target internally consistent -- an impossible combo (e.g.
# motion=parked + goal_dist=far) makes every sample invalid (constant -1, no
# GRPO gradient). WARNING: with type not pinned to vehicle geometry anymore, a
# checked field the frozen prior samples off-distribution can drive high reject.
gen_agent_invalid:
  enabled: true
  check_type: true
  check_motion: true
  check_goal_dist: true
  check_ego_dist: true

# --- artifacts -------------------------------------------------------------
# Must be the base run trained by config_ldm_adv_base (ldm_adv.train.run_name) and
# the SAME goal autoencoder whose latents that run diffused -- the LDM's latent
# space is tied to one autoencoder, so a mismatched ae_ckpt decodes to garbage.
ldm_adv_ckpt: ${scratch_root}/checkpoints/advscene_ldm_adv_base/last.ckpt
ae_ckpt: ${scratch_root}/checkpoints/advscene_ae_goal_waymo/last.ckpt
use_ema_weights: true

# --- conditioning pools (native ldm_adv latent cache; no dump step) ---------
train_split: train
eval_split: val
pool_size: 40000

# --- rollout / reward --------------------------------------------------------
# Strict configs feed ddpo.reward.PufferSimulator; every key must match a
# dataclass field (missing or unknown keys raise at construction). Two of the
# four sections are composed by the entrypoint defaults list, not defined here:
#
# planner (WHICH policy drives each role + that policy's conditioning obs):
# one cfgs/planner/<name>.yaml per role (planner@ddpo.planner.sut / .env /
# .adv, all three from the ppo_* family); swap a role's checkpoint or override
# its conditioning (e.g. ddpo.planner.adv.conditioning.collision_factor=0 for a
# reckless adversary) in the entry config.
# planner.sim (SHARED rollout dynamics: dt, goal lifecycle, map extent):
# cfgs/rollout/base.yaml, composed at rollout@ddpo.planner.sim.
#
# simulator: HOW the rollout measures metrics while stepping
# (sim.runner.SimulatorConfig; seed and the gen_agent_invalid check are
# injected by the training loop).
simulator:
  sim_steps: 91
  init_overlap_margin: 0.0         # 0 = flag only true spawn interpenetration (m)
  goal_offlane_threshold: 2.75     # diagnostic off-lane flag: adv goal lane dist (m)
  goal_onroad_threshold: 2.75      # diagnostic off-lane flag: adv spawn lane dist (m)
  approach_warmup_time: 0.5        # ignore first N s when measuring closing
  ego_offroad_threshold: 2.75      # off-road proxy: ego dist to nearest centerline (m)

# reward: HOW the scalar reward is assembled from the rollout metrics
# (ddpo.reward.RewardConfig). criticality = risk_coef * noisy_OR(R_ttc,
# w_app * R_approach), hard-gated to 0 on rejected / overlapping-init scenes;
# lane constraints are soft-subtracted on the valid branch; a time-ramped
# collision / ego-fault bonus is added on top (valid branch only).
reward:
  ttc_tau: 3.0                     # TTC horizon normalising the dense risk term (s)
  risk_coef: 1.0
  approach_d_safe: 6.0             # adversary "close" scale for the proximity gate (m)
  approach_d_scale: 2.0
  approach_close_delta: 2.0        # min (d0 - dmin) closed-in distance to score (m)
  approach_close_scale: 1.0        # closing-gate sharpness (smaller = crisper gate)
  lane_soft: 1.75                  # lane penalty ramps from lane_soft to lane_hard (m)
  lane_hard: 2.75
  lane_penalty: 0.25               # weight on each continuous lane-distance penalty
  init_overlap_penalty: 0.5        # weight on the graded spawn-overlap fraction
  # Graded reject penalty: a condition-violating adversary scores
  # -(base + (1-base) * clip(gap/scale, 0, 1)) instead of a flat -1, where gap
  # is how many metres it landed outside the target bucket. The flat cliff was
  # the reward-collapse engine (run 3zjnupnh): the criticality optimum sits
  # right at the goal_dist bucket edge, and once a GRPO group slid over it the
  # uniform -1 had zero within-group contrast -> zero restoring gradient.
  invalid_penalty_base: 0.5        # penalty right at the bucket boundary
  invalid_grade_scale: 10.0        # metres past the boundary to reach the full -1 (0 = flat -1)
  collision_warmup: 0.75           # bonus ramp: a contact before this earns nothing (s)
  collision_window: 0.5            # ramp reaches 1 at warmup + window (s)
  trivial_collision_t: 0.75        # c_trivial diagnostic flag only
  # Explicit collision bonus (run 8rlw8ay8 post-mortem): the dense-only reward
  # paid a real collision only ~0.1 more than a deep near-miss -- ~0.5 sigma of
  # the within-group std, invisible to GRPO whitening, so ego_collision_rate
  # stayed flat at ~2% while the approach term absorbed the whole gradient.
  # 0.5 puts a collision ~2.5 sigma above its group; an ego-fault collision
  # (the actual target behavior: cut-ins the ego crashes into) earns 1.5 total.
  collision_bonus: 0.5
  ego_fault_bonus: 1.0
  # Approach-weight annealing: keep the dense approach gradient as a bootstrap
  # (without it the TTC/collision signal has near-zero support early on), then
  # ramp it down once the policy reliably closes in (~7 m plateau by ~it 1500 in
  # 8rlw8ay8) so it stops substituting for actual criticality.
  approach_coef: 1.0
  approach_coef_final: 0.25
  approach_anneal_begin: 2000
  approach_anneal_end: 6000

# --- DDPO ------------------------------------------------------------------
# The RL-algorithm knobs (advantage whitening, group_size, clip / KL trust
# region) are NOT here: they live in the swappable ddpo.algo group
# (cfgs/ddpo/algo/grpo.yaml, composed by the entrypoint). Below is what every
# algorithm shares: sampler, optimiser, batch / iteration schedule.
sampler: ddpm                 # ddim variant overrides this in its entrypoint
ddim_steps: 30
ddim_eta: 1.0
batch_size: 128
num_iterations: 40000
inner_epochs: 1
k_steps: 16
min_diffusion_t: 1
bf16: false
logprob_bf16: false
lr: 1e-5
weight_decay: 1e-4
grad_clip: 1.0
save_every: 500
# Resume this run from <output_dir>/last.ckpt when present: restores net weights,
# the AdamW state, the global RNG, the iteration counter and the wandb run id. The
# KL reference always stays anchored to ldm_adv_ckpt (the base manifold), never the
# resumed weights. Set false to always start a fresh DDPO run from the base ckpt.
# output_dir is wired by the entrypoint (ddpo.output_dir).
resume: true

# --- logging / eval --------------------------------------------------------
wandb:
  enabled: true
  project: ${experiment.project}
  entity: null
  run_name: ${experiment.run_name}
eval_every: 100
# Metric sample size vs media volume are decoupled: rates over 8 scenes have a
# 0.125 resolution (a true ~2% collision rate reads as a constant 0), so the
# metrics use 64 scenes while only the first eval_media_scenes get GIFs.
eval_num_scenes: 64
eval_media_scenes: 8
eval_visualize_before_rl: true
eval_visualize_no_adv: true
eval_static_baselines_once: true
# Also run the val eval/viz on a fixed subset of the train scenes (the training
# pool's first eval_num_scenes slots), logged under train_viz/*. Lets the rising
# train reward be checked visually against the held-out val/* rollouts.
eval_visualize_train: true
# Diagnostic for GRPO signal quality: every N iterations, take the current train
# batch, find the groups with the largest within-group reward spread, and log a
# table plus top/bottom rollout media. This does not change the reward or update.
train_group_viz_every: 100
train_group_viz_num_groups: 2
train_group_viz_extremes: 1
save_gif: true
gif_fps: 10
gif_max_frames: 90
