# DDPO fine-tuning of ldm_goal against a frozen PufferDrive planner.
#
# Usage:
#   python train.py --config-name config_ddpo_ldm_goal
#
# This uses the pretrained LDM checkpoint plus a frozen goal-AE decoder:
#   ${scratch_root}/checkpoints/scenario_dreamer_ldm_goal_waymo/last.ckpt
#   ${scratch_root}/checkpoints/scenario_dreamer_ae_goal_waymo/last.ckpt

model_name: ddpo

defaults:
  - _base
  - dataset_name: waymo
  - dataset@ae_goal.dataset: waymo_ae_goal
  - train@ae_goal.train: waymo_ae_goal
  - eval@ae_goal.eval: waymo_ae_goal
  - model@ae_goal.model: waymo_ae_goal
  - datamodule@ae_goal.datamodule: waymo_ae_goal
  - dataset@ldm_goal.dataset: waymo_ldm_goal
  - train@ldm_goal.train: waymo_ldm_goal
  - eval@ldm_goal.eval: waymo_ldm_goal
  - model@ldm_goal.model: waymo_ldm_goal
  - datamodule@ldm_goal.datamodule: waymo_ldm_goal
  - ddpo/ldm_goal@ddpo
  - sim: base
  - _self_
