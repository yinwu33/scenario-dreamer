# Critical-scene Stage 2: DDPO fine-tuning of ldm_adv with stochastic DDIM
# timestep sub-sampling (fewer, faster sampling steps per rollout). Inherits
# everything (flow, reward, algo, planners) from the DDPM entrypoint and only
# switches the sampler + run_name.
#
# Usage:
#   python train.py --config-name config_critical_scene_ldm_adv_ddim
#   python train.py --config-name config_critical_scene_ldm_adv_ddim ddpo.ddim_steps=25

defaults:
  - config_critical_scene_ldm_adv_ddpo
  - _self_

ddpo:
  sampler: ddim
  ddim_steps: 50
  ddim_eta: 1.0

experiment:
  run_name: critical_scene_${experiment.stage}_${experiment.generator}_${experiment.sampler}${ddpo.ddim_steps}_eta${ddpo.ddim_eta}_${experiment.planner_name}
