# Rule-based lane-centerline rollout.
#
# Each controlled agent moves from its generated spawn to a nearby lane
# centerline, follows successor-connected centerlines at constant speed, then
# leaves the centerline to reach its generated goal. No collision avoidance.
name: centerline_dummy

# Number of nearest lanes considered for spawn/goal projection. Higher values
# make route search more robust when the nearest lane is disconnected.
candidate_lanes: 5

# Used only when lane graph metadata is absent: connect lane i -> j when i's end
# is within this distance of j's start and their tangents roughly agree.
connect_radius: 2.5

# Keep lane changes disabled for the first deterministic baseline; successor
# links alone define the route.
allow_lane_changes: false
allow_backward_same_lane: false

# If no connected centerline route is found, fall back to a direct constant-speed
# path to the goal instead of dropping the agent.
fallback_to_straight: true

# Speed is still based on the generated spawn speed. The cap avoids pathological
# DDPO samples causing huge single-step jumps; raise/null it for experiments.
min_speed: 0.0
max_speed: 30.0
