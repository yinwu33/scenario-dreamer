# Centerline-only PDM-Closed adaptation (sim/planners/pdm.py).
#
# Rule-based and checkpoint-free. It reuses IDM's lane-graph route and expands
# several longitudinal IDM policies over that one centerline. Proposals are
# scored by collision, short-horizon TTC and route progress; comfort and
# nuPlan-only map semantics are intentionally absent.
name: pdm
conditioning: null

# Shared IDM dynamics. The proposal grid below varies the three behaviour
# parameters that most directly trade progress against yielding.
target_speed: 15.0
min_gap: 1.0
headway_time: 1.5
max_accel: 2.0
comfort_decel: 6.0
accel_exponent: 4.0

lateral_margin: 0.3
lead_search_radius: 40.0  # free-flow gate; grows with v^2/2a (see idm.yaml)

lookahead_time: 0.9
lookahead_min: 3.0
lookahead_max: 12.0
steer_preview_steps: 5

route:
  spacing: 1.0
  max_depth: 12

proposal:
  horizon_steps: 30       # 3 s at rollout dt=0.1
  ttc_steps: 10           # continue proposals 1 s for the TTC score
  # PDM-Closed's proposal set: {20,40,60,80,100}% of the target speed crossed
  # with lateral centerline offsets {-1,0,+1} m = 15 proposals. The lateral axis
  # is what makes a proposal set stronger than one IDM policy -- without it every
  # proposal follows the identical path and the selection can only pick a speed.
  # Standstill gap and headway are NOT proposal axes in PDM; they stay scalar.
  target_speeds: [3.0, 6.0, 9.0, 12.0, 15.0]
  min_gaps: [1.0]
  headway_times: [1.5]
  lateral_offsets: [-1.0, 0.0, 1.0]
  progress_weight: 5.0
  ttc_weight: 5.0
  # Score cost per metre of lateral deviation. Small against the collision gate
  # (a genuine evasion is worth up to progress_weight + ttc_weight), but large
  # enough that an offset is never taken on a tie -- see PDMPlanner scoring.
  offset_weight: 0.2
