# Critical-scene Stage 2: DDPO fine-tuning of dm_fixed_map_agent_goal (DDPM)
# against a frozen planner.

model_name: ddpo

defaults:
  - _base
  - dataset_name: waymo
  - dm_fixed_map_agent_goal/dataset@dm_fixed_map_agent_goal.dataset
  - dm_fixed_map_agent_goal/train@dm_fixed_map_agent_goal.train
  - dm_fixed_map_agent_goal/eval@dm_fixed_map_agent_goal.eval
  - dm_fixed_map_agent_goal/model@dm_fixed_map_agent_goal.model
  - dm_fixed_map_agent_goal/datamodule@dm_fixed_map_agent_goal.datamodule
  - ddpo/dm_fixed_map_agent_goal@ddpo
  - planner@ddpo.planner: selfplay_drive
  - sim: base
  - _self_

experiment:
  project: critical_scene
  stage: ddpo
  generator: dm_fixed_map_agent_goal
  sampler: ${ddpo.sampler}
  planner_name: ${oc.select:ddpo.planner.name,none}
  run_name: critical_scene_${experiment.stage}_${experiment.generator}_${experiment.sampler}_${experiment.planner_name}_${ddpo.mode}
  output_dir: ${scratch_root}/critical_scene/${experiment.run_name}
