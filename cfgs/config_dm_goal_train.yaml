# dm_goal diffusion model training on Waymo.
#
# Usage:
#   python train.py --config-name config_dm_goal_train

model_name: dm_goal

defaults:
  - _base
  - dataset_name: waymo
  - dm_goal/dataset@dm_goal.dataset
  - dm_goal/train@dm_goal.train
  - dm_goal/eval@dm_goal.eval
  - dm_goal/model@dm_goal.model
  - dm_goal/datamodule@dm_goal.datamodule
  - sim: base
  - _self_

dm_goal:
  train:
    devices: 1
    track: True
    run_name: scenario_dreamer_dm_goal_train
