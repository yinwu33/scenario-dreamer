# Critical-scene Stage 2: DDPO fine-tuning of dm_goal with stochastic DDIM
# timestep sub-sampling. Entrypoint kept at cfgs/ root (see _ddpm variant).
#
# Usage:
#   python train.py --config-name config_critical_scene_dm_goal_ddim
#   python train.py --config-name config_critical_scene_dm_goal_ddim ddpo.ddim_steps=25

model_name: ddpo

defaults:
  - _base
  - dataset_name: waymo
  - dm_goal/dataset@dm_goal.dataset
  - dm_goal/train@dm_goal.train
  - dm_goal/eval@dm_goal.eval
  - dm_goal/model@dm_goal.model
  - dm_goal/datamodule@dm_goal.datamodule
  - ddpo/dm_goal@ddpo
  - planner@ddpo.planner: dummy
  - sim: base
  - _self_

experiment:
  project: critical_scene
  stage: ddpo
  generator: dm_goal
  sampler: ${ddpo.sampler}
  planner_name: ${oc.select:ddpo.planner.name,none}
  run_name: critical_scene_${experiment.stage}_${experiment.generator}_${experiment.sampler}${ddpo.ddim_steps}_eta${ddpo.ddim_eta}_${experiment.planner_name}_${ddpo.mode}
  output_dir: ${scratch_root}/critical_scene/${experiment.run_name}

ddpo:
  sampler: ddim
  ddim_steps: 50
  ddim_eta: 1.0
