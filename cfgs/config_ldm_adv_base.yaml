# ldm_adv latent-diffusion training on Waymo (normal-agent + one adversarial
# agent per scene), diffusing the goal-autoencoder latents.
#
# Usage:
#   python train.py --config-name config_ldm_adv_base
#
# Reuses the pre-trained goal autoencoder (advscene_ae_goal_waymo) and
# its exported latent cache (advscene_ae_goal_latents_waymo) -- the
# autoencoder is unaware of the adversary, the adv is split off at load time.

model_name: ldm_adv

defaults:
  - _base
  - dataset_name: waymo
  - ldm_adv/dataset@ldm_adv.dataset
  - ldm_adv/train@ldm_adv.train
  - ldm_adv/eval@ldm_adv.eval
  - ldm_adv/model@ldm_adv.model
  - ldm_adv/datamodule@ldm_adv.datamodule
  # the (frozen) goal autoencoder cfg, loaded by the LDM lightning module
  - ae_goal/dataset@ae_goal.dataset
  - ae_goal/train@ae_goal.train
  - ae_goal/eval@ae_goal.eval
  - ae_goal/model@ae_goal.model
  - ae_goal/datamodule@ae_goal.datamodule
  - _self_

ldm_adv:
  train:
    devices: 1
    track: True
    run_name: advscene_ldm_adv_base

experiment:
  project: advscene
