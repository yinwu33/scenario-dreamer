defaults:
- /eval/base@_here_
- _self_

run_name: SceneControl  # must match dm_goal.train.run_name -- eval loads the checkpoint from here

mode: initial_scene
num_samples: 100
split_name: val
# Layout prior estimated on the SAME v2 records dm_goal trains on
# (scripts/create_goal_init_prob_matrix.py --source v2). NOT the baseline's
# initial_prob_matrix_waymo.pt: the goal preprocessing drops agents without a
# valid goal and off-road vehicles, so its (num_lanes, num_agents) distribution
# differs. 2D and map_id-free, like the ldm_adv prior.
init_prob_matrix_path: ${project_root}/metadata/initial_prob_matrix_goal_waymo.pt
inpainting_prob_matrix_path: ${project_root}/metadata/inpainting_prob_matrix_waymo.pt # unused
batch_size: 32
visualize: False
viz_dir: ${project_root}/viz_gen_samples_${dm_goal.eval.run_name}
cache_samples: False
conditioning_path: null

metrics:
  mode: initial_scene
  samples_path: ${dataset_root}/checkpoints/${dm_goal.eval.run_name}/${dm_goal.eval.metrics.mode}_samples
  metrics_save_path: ${dataset_root}/checkpoints/${dm_goal.eval.run_name}
  metrics_filename: metrics_${dm_goal.eval.metrics.mode}.pkl
  # Same reference set as ldm_adv so the two are directly comparable.
  eval_set: ${project_root}/metadata/waymo_goal_val_eval_set.pkl
  gt_test_dir: ${dataset_root}/advscene_preprocess_waymo/val
  gt_format: goal
