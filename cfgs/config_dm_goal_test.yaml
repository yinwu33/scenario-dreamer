# Smoke-test config for dm_goal training on the Waymo validation split.
#
# Usage:
#   python train.py --config-name config_dm_goal_test

model_name: dm_goal

defaults:
  - _base
  - dataset_name: waymo
  - dm_goal/dataset@dm_goal.dataset
  - dm_goal/train@dm_goal.train
  - dm_goal/eval@dm_goal.eval
  - dm_goal/model@dm_goal.model
  - dm_goal/datamodule@dm_goal.datamodule
  - sim: base
  - _self_
