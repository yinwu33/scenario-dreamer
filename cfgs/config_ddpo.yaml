# Backward-compatible alias for dm_goal DDPO.
# Prefer the explicit configs:
#   python train.py --config-name config_ddpo_dm_goal
#   python train.py --config-name config_ddpo_ldm_goal
#
# Usage:
#   python train.py --config-name config_ddpo      # same as config_ddpo_dm_goal
#   python train_ddpo.py                            # deprecated shim, still works
#   python train.py --config-name config_ddpo ddpo.mode=goal_only   # goal_only | agent_only | full

model_name: ddpo

defaults:
  - _base
  - dataset_name: waymo
  - dm_goal/dataset@dm_goal.dataset
  - dm_goal/train@dm_goal.train
  - dm_goal/eval@dm_goal.eval
  - dm_goal/model@dm_goal.model
  - dm_goal/datamodule@dm_goal.datamodule
  - ddpo/dm_goal@ddpo
  - sim: base
  - _self_
