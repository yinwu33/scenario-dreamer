# Critical-scene Stage 2: DDPO fine-tuning of ldm_goal (latent-space policy +
# frozen goal-AE decoder) against a frozen planner. Entrypoint kept at cfgs/
# root (see _dm_goal_ddpm variant).
#
# Uses the pretrained LDM checkpoint plus a frozen goal-AE decoder:
#   ${scratch_root}/checkpoints/scenario_dreamer_ldm_goal_waymo/last.ckpt
#   ${scratch_root}/checkpoints/scenario_dreamer_ae_goal_waymo/last.ckpt
#
# Usage:
#   python train.py --config-name config_critical_scene_ldm_goal

model_name: ddpo

defaults:
  - _base
  - dataset_name: waymo
  - dataset@ae_goal.dataset: waymo_ae_goal
  - train@ae_goal.train: waymo_ae_goal
  - eval@ae_goal.eval: waymo_ae_goal
  - model@ae_goal.model: waymo_ae_goal
  - datamodule@ae_goal.datamodule: waymo_ae_goal
  - dataset@ldm_goal.dataset: waymo_ldm_goal
  - train@ldm_goal.train: waymo_ldm_goal
  - eval@ldm_goal.eval: waymo_ldm_goal
  - model@ldm_goal.model: waymo_ldm_goal
  - datamodule@ldm_goal.datamodule: waymo_ldm_goal
  - ddpo/ldm_goal@ddpo
  - sim: base
  - _self_

# ldm_goal DDPO has no per-mode / sampler / planner knobs; planner defaults to the
# reward's built-in (no planner group composed), so planner_name resolves to "none".
experiment:
  project: critical_scene
  stage: ddpo
  generator: ldm_goal
  sampler: ldm
  planner_name: ${oc.select:ddpo.planner.name,none}
  run_name: critical_scene_${experiment.stage}_${experiment.generator}_${experiment.planner_name}
  output_dir: ${scratch_root}/critical_scene/${experiment.run_name}
