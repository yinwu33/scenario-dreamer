# DDPO fine-tuning of dm_goal with stochastic DDIM timestep sub-sampling.
#
# Original DDPM entrypoint is unchanged:
#   python train.py --config-name config_ddpo_dm_goal
#
# DDIM entrypoint:
#   python train.py --config-name config_ddpo_dm_goal_ddim
#   python train.py --config-name config_ddpo_dm_goal_ddim ddpo.ddim_steps=25

model_name: ddpo

defaults:
  - _base
  - dataset_name: waymo
  - dm_goal/dataset@dm_goal.dataset
  - dm_goal/train@dm_goal.train
  - dm_goal/eval@dm_goal.eval
  - dm_goal/model@dm_goal.model
  - dm_goal/datamodule@dm_goal.datamodule
  - ddpo/dm_goal@ddpo
  - planner@ddpo.planner: dummy
  - sim: base
  - _self_

ddpo:
  sampler: ddim
  ddim_steps: 50
  ddim_eta: 1.0
  output_dir: ${scratch_root}/checkpoints/ddpo_dm_goal_${ddpo.mode}_ddim${ddpo.ddim_steps}_eta${ddpo.ddim_eta}
  wandb:
    run_name: ddpo_dm_goal_${ddpo.mode}_ddim${ddpo.ddim_steps}_eta${ddpo.ddim_eta}
