defaults:
- waymo_base

# reuse the SDC-centered selfplay pickles (same source as the dm_goal pipeline)
dataset_path: ${dataset_root}/scene_goal_preprocess_waymo # source of preprocessed goal-augmented scenes
preprocess: True # always load from preprocessed pickles (no slow path here)
preprocess_dir: ${dataset_root}/scene_goal_preprocess_waymo # directory holding the preprocessed pickles
generate_only_vehicles: False
remove_left_right_connections: False
use_goal: True # flag consumed by the autoencoder model to select the goal dataset for latent caching
