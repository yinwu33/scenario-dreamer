defaults:
- waymo_base

dataset_path: ${dataset_root}/scenario_dreamer_ae_goal_latents_waymo # path to goal-AE latent cache for training ldm_goal
latent_stats_dir: ${project_root}/metadata/latent_stats # directory to save latent statistics (mean/std across training data for normalization)
latent_stats_path: ${ldm_goal.dataset.latent_stats_dir}/${ldm_goal.model.autoencoder_run_name}.pkl # path to save latent statistics
agent_latents_mean: null # mean of agent latents, to be computed from training data
