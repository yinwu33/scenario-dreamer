defaults:
- /model/dm@_here_
- _self_

# Mirrors the dm_goal model dims (per-agent goals). The adversary shares the
# agent latent layout, so it uses agent_latent_dim
# (state_dim + num_agent_types = 9 + 3), where state_dim 9 is
# [x, y, speed, cosθ, sinθ, length, width, goal_x, goal_y].
state_dim: 9
lane_attr: 2
num_points_per_lane: ${dm_adv.dataset.num_points_per_lane}
agent_latent_dim: 12
lane_latent_dim: 40
lane_conn_hidden_dim: 64
