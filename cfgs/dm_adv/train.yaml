defaults:
- /train/base@_here_
- _self_

run_name: scenario_dreamer_dm_adv_base_waymo
precision: bf16-mixed
lr_schedule: constant
save_top_k: 0
max_steps: 500000
warmup_steps: 500
weight_decay: 1e-5
check_val_every_n_epoch: 2
ema_decay: 0.9999
devices: 1
# Viz of the adversary is disabled by default (the base scene viz does not draw
# the separate adv node); set > 0 to render the normal agents + lanes.
num_samples_to_visualize: 0
viz_dir: ${project_root}/viz_val_${dm_adv.train.run_name}

lane_weight: 10
agent_type_weight: 1.0
lane_conn_weight: 10

# dm_adv specific
adv_weight: 1.0
# "all": jointly train lane + normal agents + adversary from scratch.
# "adv_only": freeze the base scene model and train only the adversary branch
#             (DMAdv.freeze_non_adv_parameters); load base weights via the
#             resume/ckpt path before switching to this mode.
train_mode: all
