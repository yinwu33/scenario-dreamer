defaults:
- /dataset/waymo_base@_here_
- _self_

# ldm_adv reuses the EXACT goal-autoencoder latent cache (per-agent latents). The
# single adversarial agent is split off on the fly at load time, so nothing needs
# to be re-exported -- the autoencoder is unaware of the adversary.
dataset_path: ${dataset_root}/scenario_dreamer_ae_goal_latents_waymo
latent_stats_dir: ${project_root}/metadata/latent_stats
latent_stats_path: ${ldm_adv.dataset.latent_stats_dir}/${ldm_adv.model.autoencoder_run_name}.pkl
agent_latents_mean: null # mean of agent latents, loaded from cached latent stats
agent_latents_std: null # std of agent latents, loaded from cached latent stats
lane_latents_mean: null # mean of lane latents, loaded from cached latent stats
lane_latents_std: null # std of lane latents, loaded from cached latent stats

# Adversary conditioning (adv-only). Three discretized labels are derived from the
# adv's own (normalized) state in the latent cache and fed to the DiT adv stream:
#   type   = argmax(agent_types) in [0=vehicle, 1=pedestrian, 2=cyclist]
#   motion = 0 (parked) if ||goal_xy - current_xy|| < MIN_DISTANCE_TO_GOAL (2m)
#   dist   = 0 (near) / 1 (middle) / 2 (far) bucketed on ||adv - ego|| in metres
adv_cond_dist_near_threshold: 10.0   # m; ||adv - ego|| below this is "near"
adv_cond_dist_far_threshold: 25.0    # m; above this is "far" (between -> "middle")
