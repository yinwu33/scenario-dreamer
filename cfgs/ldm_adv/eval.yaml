defaults:
- /eval/base@_here_
- _self_

run_name: scenario_dreamer_ldm_adv_base_waymo

mode: init_scene
num_samples: 100

# Scenes to generate always come from the layout prior: (num_lanes, num_agents) is
# sampled from init_prob_matrix_path and every conditioning label is left at its
# trained null token. That is an UNCONDITIONAL generator -- the same protocol the
# baseline LDM is evaluated under, so the two are directly comparable. Generating
# from real scenes is not supported here; the conditioned modes (init_agent /
# init_adv) are exercised by the DDPO flow, which builds its own graphs.
split_name: val
# Layout prior estimated on the goal latent cache (scripts/create_goal_init_prob_matrix.py).
# NOT the baseline's initial_prob_matrix_waymo.pt: the goal preprocessing drops agents
# without a valid goal and caps the scene at max_num_agents, so its (num_lanes,
# num_agents) distribution differs. Counts TOTAL agents; one is split off as the adv.
init_prob_matrix_path: ${project_root}/metadata/initial_prob_matrix_goal_waymo.pt
inpainting_prob_matrix_path: ${project_root}/metadata/inpainting_prob_matrix_waymo.pt  # not in use for my task
batch_size: 32
visualize: False
viz_dir: ${project_root}/viz_gen_samples_${ldm_adv.eval.run_name}
cache_samples: False
conditioning_path: null
cache_dir: ${dataset_root}/checkpoints/${ldm_adv.eval.run_name}/${ldm_adv.eval.mode}_samples

# TODO: below not in use, remove it in the future
sim_envs:
  num_inpainting_candidates: 8
  overhead_factor: 5
  route_length: 500
  nocturne_compatible_only: True

metrics:
  mode: init_scene
  samples_path: ${dataset_root}/checkpoints/${ldm_adv.eval.run_name}/${ldm_adv.eval.metrics.mode}_samples
  metrics_save_path: ${dataset_root}/checkpoints/${ldm_adv.eval.run_name}
  metrics_filename: metrics_${ldm_adv.eval.metrics.mode}.pkl
  # Shared reference set with the baseline LDM: same scenes, same ground-truth
  # preparation (see cfgs/eval/waymo_ldm.yaml), so the w/o-goal numbers of the two
  # models are computed against an identical real distribution.
  eval_set: ${project_root}/metadata/waymo_goal_val_eval_set.pkl
  # v2 records: gt_format=goal runs utils.goal_runtime.prepare_scene on each one,
  # so this must be the same preprocessed data the AE / LDM-Adv were trained on.
  gt_test_dir: ${dataset_root}/advscene_preprocess_waymo/val
  gt_format: goal
