defaults:
- /train/base@_here_
- _self_

run_name: scenario_dreamer_ldm_adv_base_waymo
lr_schedule: constant
save_top_k: 0
max_steps: 400000
warmup_steps: 500
weight_decay: 1e-5
check_val_every_n_epoch: 2
ema_decay: 0.9999
devices: 1
# Number of validation scenes to render each viz epoch: lanes + normal agents,
# with the adversarial agent overlaid in green (matches dm_adv scene plots).
num_samples_to_visualize: 8
viz_dir: ${project_root}/viz_val_${ldm_adv.train.run_name}

# computed once at the start of training (mean/std of latents for normalization);
# reuses the existing goal-AE latent stats file if it is already cached.
num_batches_compute_stats: 250
batch_size_compute_stats: 1024

lane_weight: 10

# ldm_adv specific
adv_weight: 1.0
# "all": jointly train lane + normal-agent + adversary latents from scratch.
# "adv_only": freeze the base scene model and train only the adversary branch
#             (LDMAdv -> DiT.freeze_non_adv_parameters); load base weights via
#             the resume/ckpt path before switching to this mode.
# "mixed": per scene, draw one of the sampling configurations (init_scene /
#          init_agent / init_adv) from mode_probs, so the conditioned modes'
#          (clean context, noisy target) inputs are in the training
#          distribution. No new weights: warm-starting from an "all"
#          checkpoint is supported and recommended over training from scratch.
train_mode: mixed
# Only used when train_mode == mixed. init_agent (lane-conditioned generation)
# is off by default -- the DDPO critical-scene pipeline only needs init_adv;
# give it mass only if lane-conditioned generation is actually used.
mode_probs:
  init_scene: 0.7
  init_agent: 0.0
  init_adv: 0.3
