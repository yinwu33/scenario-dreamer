defaults:
- /model/ldm@_here_
- _self_

# Diffuse over the goal-autoencoder latents. agent_latent_dim (8) and
# lane_latent_dim (24) are inherited from /model/ldm; the adversary shares the
# agent latent layout (dit_ex sets adv_latent_dim = agent_latent_dim).
autoencoder_run_name: advscene_ae_goal_waymo # the goal autoencoder run
autoencoder_path: ${scratch_root}/checkpoints/${ldm_adv.model.autoencoder_run_name}/last.ckpt

# Conditioning: embed the discretized labels (see ldm_adv.dataset.cond_*) and add
# them onto the agent / adv streams' conditioning vectors inside the DiT.
#   normal agent: [type, motion, goal_dist]
#   adversary:    [type, motion, goal_dist, ego_dist]
# cond_dropout_prob (> 0) gives each embedder a null index used for the per-agent
# unconditional dropout, so uncontrolled agents can be left unconditioned at
# inference (set data["agent"].cond_drop = 1 for them). No classifier-free
# guidance scaling. The adv embedders live in the adv-only trainable set so
# adv_only / DDPO finetuning keeps them learnable; the agent embedders are part
# of the frozen base. Toggle either flag off to recover an unconditioned stream.
use_agent_conditioning: true
use_adv_conditioning: true
cond_dropout_prob: 0.2  # per-agent unconditional dropout (must be > 0 when conditioning)
# Per-SCENE joint dropout: with this probability the whole scene goes null (every
# agent AND all four adv fields at once). The iid dropout above never produces
# that state (p^n_agents * p^4), yet it is exactly what prior-mode / base eval
# feeds in, so without this the unconditional protocol is out-of-distribution.
cond_uncond_scene_prob: 0.1
cond_num_types: 3       # vehicle / pedestrian / cyclist (matches dataset.num_agent_types)
cond_num_motion: 2      # parked / moving
cond_num_goaldist: 3    # near / middle / far (goal-spawn travel distance)
cond_num_egodist: 3     # near / middle / far (adversary distance to ego; adv only)
