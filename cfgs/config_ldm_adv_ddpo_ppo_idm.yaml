# Critical-scene Stage 2, PPO-IDM planner pair.
# See cfgs/config_ldm_adv_ddpo_idm_idm.yaml for the pair convention.
#
# Usage:
#   python train.py --config-name config_ldm_adv_ddpo_ppo_idm

defaults:
  - config_ldm_adv_ddpo
  - override planner@ddpo.planner.sut: ppo_normal
  - override planner@ddpo.planner.env: idm
  - override planner@ddpo.planner.adv: idm
  - _self_

ddpo:
  context_prior:
    path: ${project_root}/data/headroom_probe/context_prior_ppo-idm.json
    focus_frac: 0.7

experiment:
  planner_name: ppo-idm
