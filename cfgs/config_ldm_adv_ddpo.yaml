# Critical-scene Stage 2: DDPO fine-tuning of ldm_adv (latent-space single
# adversary, DDPM sampler) against a frozen planner. Adapts the map-conditioned
# dm flow (config_critical_scene_map_conditioned_dm_goal) to ldm_adv: the base
# scene is pruned to the ego, only the adversary latent is generated/trained, and
# the SAME Phase-2 reward + GRPO settings are reused (see cfgs/ddpo/ldm_adv.yaml).
#
# Uses the pretrained ldm_adv checkpoint plus the frozen goal autoencoder:
#   ${scratch_root}/checkpoints/scenario_dreamer_ldm_adv_train/last.ckpt
#   ${scratch_root}/checkpoints/scenario_dreamer_ae_goal_waymo/last.ckpt
#
# Usage:
#   python train.py --config-name config_advscene_ldm_adv_ddpo

model_name: ddpo

defaults:
  - _base
  - dataset_name: waymo
  - ldm_adv/dataset@ldm_adv.dataset
  - ldm_adv/train@ldm_adv.train
  - ldm_adv/eval@ldm_adv.eval
  - ldm_adv/model@ldm_adv.model
  - ldm_adv/datamodule@ldm_adv.datamodule
  # the (frozen) goal autoencoder cfg, loaded by the LDMAdv policy
  - ae_goal/dataset@ae_goal.dataset
  - ae_goal/train@ae_goal.train
  - ae_goal/eval@ae_goal.eval
  - ae_goal/model@ae_goal.model
  - ae_goal/datamodule@ae_goal.datamodule
  - ddpo/ldm_adv@ddpo
  # RL-algorithm axis (advantage whitening, group_size, clip / KL trust
  # region): swap with e.g. ddpo/algo@ddpo.algo=ppo once a sibling yaml exists.
  - ddpo/algo@ddpo.algo: grpo
  # One planner per role: sut = ego (system under test), env = background
  # traffic, adv = the generated adversary. Each planner yaml also carries its
  # policy's conditioning obs (how defensively that role drives).
  #
  # All three roles currently run the SAME ppo config, i.e. the adversary
  # is as avoidant as everyone else (collision_factor 2.0). To make only the
  # adversary reckless, override its conditioning rather than adding a planner:
  #   ddpo.planner.adv.conditioning.collision_factor=0
  - planner@ddpo.planner.sut: ppo_normal
  - planner@ddpo.planner.env: ppo_aggressive
  - planner@ddpo.planner.adv: ppo_aggressive
  # Shared rollout dynamics (dt, goal lifecycle, conditioning ranges) -- a
  # property of the rollout, not of one role's policy.
  - rollout@ddpo.planner.sim: base
  - _self_

# DDPO only fine-tunes the adversary branch; freeze the base scene streams.
ldm_adv:
  train:
    train_mode: adv_only

ddpo:
  output_dir: ${experiment.output_dir}

experiment:
  project: advscene
  stage: ddpo
  generator: ldm_adv
  sampler: ${ddpo.sampler}
  planner_name: ${oc.select:ddpo.planner.sut.name,none}
  run_name: critical_scene_${experiment.stage}_${experiment.generator}_${experiment.sampler}_${experiment.planner_name}
  output_dir: ${scratch_root}/critical_scene/${experiment.run_name}
