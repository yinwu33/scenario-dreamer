# Critical-scene Stage 2: DDPO fine-tuning of ldm_adv against a frozen planner
# trio. Carries everything a DDPO run needs except which planner drives each
# role and which contexts to draw -- those live in the pair entrypoints
# (config_ldm_adv_ddpo_<sut>_<env>.yaml).
#
# Usage:
#   python train.py --config-name config_ldm_adv_ddpo

model_name: ddpo

defaults:
  - _base
  - dataset_name: waymo
  - ldm_adv/dataset@ldm_adv.dataset
  - ldm_adv/train@ldm_adv.train
  - ldm_adv/eval@ldm_adv.eval
  - ldm_adv/model@ldm_adv.model
  - ldm_adv/datamodule@ldm_adv.datamodule
  # the (frozen) goal autoencoder cfg, loaded by the LDMAdv policy
  - ae_goal/dataset@ae_goal.dataset
  - ae_goal/train@ae_goal.train
  - ae_goal/eval@ae_goal.eval
  - ae_goal/model@ae_goal.model
  - ae_goal/datamodule@ae_goal.datamodule
  - ddpo/ldm_adv@ddpo
  # RL-algorithm axis: ddpo/algo@ddpo.algo=<name>
  - ddpo/algo@ddpo.algo: grpo
  # Reward axis, no per-reward entrypoint file:
  #   python train.py --config-name config_ldm_adv_ddpo_idm_idm ddpo/reward=full
  - ddpo/reward: hierarchical_v2
  # sut = ego (system under test), env = background traffic, adv = the generated
  # adversary. Each planner yaml carries that role's conditioning obs; override
  # it rather than adding a planner:
  #   ddpo.planner.adv.conditioning.collision_factor=0
  - planner@ddpo.planner.sut: ppo_normal
  - planner@ddpo.planner.env: ppo_aggressive
  - planner@ddpo.planner.adv: ppo_aggressive
  # Shared rollout dynamics (dt, goal lifecycle, map extent); the same values
  # the planner benchmark composes.
  - rollout@ddpo.planner.sim: base
  - _self_

# DDPO only fine-tunes the adversary branch; freeze the base scene streams.
ldm_adv:
  train:
    train_mode: adv_only

ddpo:
  output_dir: ${experiment.output_dir}

  # Shared training recipe (overrides cfgs/ddpo/ldm_adv.yaml defaults).
  lr: 3e-5
  sampler: ddim
  ddim_steps: 30
  ddim_eta: 1.0
  k_steps: 32

  gen_agent_invalid:
    check_goal_dist: false

experiment:
  project: advscene
  stage: ddpo
  generator: ldm_adv
  sampler: ${ddpo.sampler}
  planner_name: ${oc.select:ddpo.planner.sut.name,none}
  # ddpo.reward_run_tag keeps each reward variant in its own output_dir; without
  # it resume=true would continue a run trained under a different reward.
  run_name: critical_scene_${experiment.stage}_${experiment.generator}_${experiment.sampler}_${experiment.planner_name}${ddpo.reward_run_tag}
  output_dir: ${scratch_root}/critical_scene/${experiment.run_name}
